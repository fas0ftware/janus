<svg xmlns="http://www.w3.org/2000/svg" width="720" height="262" viewBox="0 0 720 262">
<rect width="100%" height="100%" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect width="100%" height="32" rx="10" fill="#161b22"/><rect y="22" width="100%" height="10" fill="#161b22"/>
<circle cx="18" cy="16" r="6" fill="#ff5f56"/><circle cx="38" cy="16" r="6" fill="#ffbd2e"/><circle cx="58" cy="16" r="6" fill="#27c93f"/>
<text x="360" y="21" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" text-anchor="middle">janus — sanitizers, valgrind, ThreadSanitizer, cppcheck, secret scan</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve">
<text x="14" y="56" fill="#58a6ff">$ make check</text>
<text x="14" y="74" fill="#e6edf3"></text>
<text x="14" y="92" fill="#3fb950">60 passed, 0 failed</text>
<text x="14" y="110" fill="#e6edf3">valgrind: no leaks or memory errors</text>
<text x="14" y="128" fill="#e6edf3">tsan: no data races reported</text>
<text x="14" y="146" fill="#e6edf3"></text>
<text x="14" y="164" fill="#d29922">$ cppcheck --enable=warning,portability,performance src/</text>
<text x="14" y="182" fill="#e6edf3">cppcheck: no issues</text>
<text x="14" y="200" fill="#e6edf3"></text>
<text x="14" y="218" fill="#58a6ff">$ secret scan (git history, 10 commits)</text>
<text x="14" y="236" fill="#e6edf3">No secrets found</text>
</g></svg>
